<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace">
  <rect x="0" y="0" width="1040" height="470" fill="#000000"/>

  <!-- faint circuit traces in the negative space -->
  <g stroke="#161616" stroke-width="1" fill="none">
    <path d="M0,60 H120 V30 M160,440 H40 V410"/>
    <path d="M1040,70 H900 V40 M880,445 H1000 V415"/>
    <circle cx="120" cy="60" r="3" fill="#161616" stroke="none"/>
    <circle cx="920" cy="70" r="3" fill="#161616" stroke="none"/>
  </g>

  <text x="520" y="52" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff" letter-spacing="1">38.60.179.31</text>
  <text x="520" y="78" text-anchor="middle" font-size="13" fill="#7a7a7a">one box doing three jobs</text>

  <!-- flow arrows, vertically centered on the cards (y=264), centered in each gap -->
  <g stroke="#666" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M342,264 h16 M357,257 l8,7 l-8,7"/>
    <path d="M674,264 h16 M689,257 l8,7 l-8,7"/>
  </g>

  <!-- ===== 1. EXPLOIT ===== -->
  <rect x="40" y="118" width="296" height="292" rx="4" fill="#070707" stroke="#333"/>
  <circle cx="72" cy="152" r="15" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="72" y="157" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="98" y="157" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="1">EXPLOIT</text>
  <line x1="56" y1="178" x2="320" y2="178" stroke="#222"/>
  <text x="188" y="202" text-anchor="middle" font-size="12" fill="#6f6f6f">break into targets</text>
  <g font-size="13.5">
    <text x="60" y="244" fill="#e8e8e8">&#9656; Java deserialization</text>
    <text x="74" y="263" font-size="11.5" fill="#777">ysoserial, CommonsCollections6</text>
    <text x="60" y="305" fill="#e8e8e8">&#9656; Rogue MySQL server</text>
    <text x="74" y="324" font-size="11.5" fill="#777">steals files from clients</text>
    <text x="60" y="366" fill="#e8e8e8">&#9656; Recon tooling</text>
    <text x="74" y="385" font-size="11.5" fill="#777">nmap, nuclei, survey.py</text>
  </g>

  <!-- ===== 2. CONTROL ===== -->
  <rect x="372" y="118" width="296" height="292" rx="4" fill="#070707" stroke="#333"/>
  <circle cx="404" cy="152" r="15" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="404" y="157" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="430" y="157" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="1">CONTROL</text>
  <line x1="388" y1="178" x2="652" y2="178" stroke="#222"/>
  <text x="520" y="202" text-anchor="middle" font-size="12" fill="#6f6f6f">hold and command them</text>
  <g font-size="13.5">
    <text x="392" y="244" fill="#e8e8e8">&#9656; Sliver C2 over mTLS</text>
    <text x="406" y="263" font-size="11.5" fill="#777">:8443, relays to 200.200.200.47</text>
    <text x="392" y="305" fill="#e8e8e8">&#9656; Python shell (c2.py)</text>
    <text x="406" y="324" font-size="11.5" fill="#777">port 80, catches the callback</text>
    <text x="392" y="366" fill="#e8e8e8">&#9656; OOB catcher</text>
    <text x="406" y="385" font-size="11.5" fill="#777">:18080 / :18081, blind RCE</text>
  </g>

  <!-- ===== 3. LOOT ===== -->
  <rect x="704" y="118" width="296" height="292" rx="4" fill="#070707" stroke="#333"/>
  <circle cx="736" cy="152" r="15" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="736" y="157" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="762" y="157" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="1">LOOT</text>
  <line x1="720" y1="178" x2="984" y2="178" stroke="#222"/>
  <text x="852" y="202" text-anchor="middle" font-size="12" fill="#6f6f6f">take and crack creds</text>
  <g font-size="13.5">
    <text x="724" y="244" fill="#e8e8e8">&#9656; Active Directory dumps</text>
    <text x="738" y="263" font-size="11.5" fill="#777">NTDS.dit, cleartext + kerberos</text>
    <text x="724" y="305" fill="#e8e8e8">&#9656; Kerberos material</text>
    <text x="738" y="324" font-size="11.5" fill="#777">keytabs, AS-REP roasting</text>
    <text x="724" y="366" fill="#e8e8e8">&#9656; Offline cracking</text>
    <text x="738" y="385" font-size="11.5" fill="#777">rockyou.txt, John the Ripper</text>
  </g>
</svg>
